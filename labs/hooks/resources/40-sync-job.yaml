# Sync-phase hook in wave 2: checks the workload after wave 1 is healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: hooks-sync-check
  namespace: hooks-lab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "SYNC_WAVE_2_STARTED"
              wget -qO- http://hooks-demo:8080/ | grep -q SYNC_WAVES_WORK
              echo "SYNC_WAVE_2_PASS"
