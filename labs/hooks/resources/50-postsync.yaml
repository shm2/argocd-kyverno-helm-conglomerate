# PostSync runs only after Sync succeeds and tracked workloads are Healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: hooks-smoke-test
  namespace: hooks-lab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "POSTSYNC_STARTED"
              wget -qO- http://hooks-demo:8080/ | grep -q SYNC_WAVES_WORK
              echo "POSTSYNC_PASS"
