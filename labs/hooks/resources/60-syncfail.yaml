# SyncFail hook only runs if a full Application sync fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: hooks-on-failure
  namespace: hooks-lab
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: failure-report
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args: ["echo SYNCFAIL_TRIGGERED"]
