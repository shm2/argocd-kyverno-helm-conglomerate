apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncopts-conflict-test
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: syncopts-lab
  source:
    repoURL: https://github.com/shm2/argocd-kyverno-helm-conglomerate.git
    targetRevision: main
    path: labs/sync-options/conflict
  syncPolicy:
    # NO automated block: this is a manual, expected-to-fail collision test.
    syncOptions:
      - FailOnSharedResource=true
