apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/shm2/argocd-kyverno-helm-conglomerate.git
    targetRevision: main
    path: labs/security-secrets/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-lab

  syncPolicy:
    automated:
      # Reconcile desired workload manifests automatically.
      enabled: true
      prune: true
      selfHeal: true
