apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac-hello
  namespace: argocd
spec:
  # Associate this Application with our restricted project.
  project: team-rbac-lab

  source:
    repoURL: https://github.com/shm2/argocd-kyverno-helm-conglomerate.git
    targetRevision: main
    path: labs/rbac/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: rbac-lab

  syncPolicy:
    automated:
      # Let Argo CD reconcile this isolated Application.
      enabled: true
      prune: true
      selfHeal: true
